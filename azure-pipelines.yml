trigger:
- main

resources:
  repositories:
    - repository: gitops
      type: github
      name: mohdkhan0159/argocd-gitops
      endpoint: github

variables:
  imageName: python-argocd-app
  acrLoginServer: argocddemoacr123.azurecr.io
  tag: $(Build.BuildId)

pool:
  vmImage: ubuntu-latest

steps:

# Checkout Application Repo
- checkout: self

# Checkout GitOps Repo
- checkout: gitops
  persistCredentials: true

# Azure Login using Workload Identity Federation
# - task: AzureCLI@2
#   displayName: Azure Login
#   inputs:
#     azureSubscription: azure-azuredevops-28-02-2026
#     scriptType: bash
#     scriptLocation: inlineScript
#     inlineScript: |
#       az account show

# Build Docker Image
- task: Docker@2
  displayName: Build Image
  inputs:
    command: build
    repository: $(acrLoginServer)/$(imageName)
    dockerfile: Dockerfile
    tags: |
      $(tag)

# Trivy Security Scan
- script: |
    sudo apt-get update
    sudo apt-get install -y wget
    wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.50.0_Linux-64bit.deb
    sudo dpkg -i trivy_0.50.0_Linux-64bit.deb
    trivy image --exit-code 1 --severity HIGH,CRITICAL $(acrLoginServer)/$(imageName):$(tag)
  displayName: Trivy Scan

# Push Image to Private ACR
- task: Docker@2
  displayName: Push Image
  inputs:
    command: push
    repository: $(acrLoginServer)/$(imageName)
    tags: |
      $(tag)
    containerRegistry: azure-azuredevops-28-02-2026

# Update GitOps Manifest
- script: |
    cd $(Build.SourcesDirectory)/argocd-gitops/dev

    echo "Updating image tag to $(tag)"

    sed -i "s|image:.*|image: $(acrLoginServer)/$(imageName):$(tag)|" deployment.yaml

    git config user.email "devops@demo.com"
    git config user.name "Azure DevOps"

    git add deployment.yaml
    git commit -m "Update image to $(tag)"
    git push
  displayName: Update GitOps Repo
